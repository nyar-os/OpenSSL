[workspace]
resolver = "2"
members = [
    "projects/open-ssl.rs/crates/core",
    "projects/open-ssl.rs/crates/napi",
]
default-members = [
    "projects/open-ssl.rs/crates/core",
    "projects/open-ssl.rs/crates/napi",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenSSL Authors"]
repository = "https://github.com/nyar-os/OpenSSL"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Audited cryptographic primitives. Protocol framing, X.509, TLS, and
# ACME logic stay in this repository.
sha2 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = "0.9"
signature = "2"
base64 = "0.22"
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "ae0db25961a72a2abc51a24b097f4363093c5394" }
# HTTP transport ownership is the family ruling: ACME and provider APIs consume
# `boost.net::http`. `std` only — the plaintext loopback slice must not pull any
# TLS backend; HTTPS consumers wait for the Boost `boost.net::tls` acceptance gate.
boost-net = { git = "https://github.com/oovm/boost.rs", rev = "724adc8c76c8f38ef99b616aab91c23c0469a158", default-features = false, features = ["std"] }
data-binary-asn1 = { git = "https://github.com/oovm/boost.rs", rev = "724adc8c76c8f38ef99b616aab91c23c0469a158" }
boost-random = { git = "https://github.com/oovm/boost.rs", rev = "724adc8c76c8f38ef99b616aab91c23c0469a158" }
open-ssl-core = { path = "projects/open-ssl.rs/crates/core", version = "0.0.0" }

[profile.release]
lto = true
panic = "abort"
