[package]
name = "open-ssl-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform-neutral N-API surface for OpenSSL"
publish = false

[lib]
name = "open_ssl_napi"
# `rlib` exists so the integration tests can call the pure capability helpers.
# Node still loads the `cdylib` addon.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wae = { workspace = true }
open-ssl-core = { workspace = true }
