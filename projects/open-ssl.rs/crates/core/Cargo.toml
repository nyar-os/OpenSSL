[package]
name = "open-ssl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenSSL domain model, capability states, and audit vocabulary"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# HTTP transport is owned by the family: ACME and DNS provider adapters send
# through `boost.net::http` and never build their own client.
boost-net = { workspace = true }
data-binary-asn1 = { workspace = true }
# Runtime recorder for continuous tuning: the same `hotspot` core that
# `database-harness` models as its `runtime` mechanism, used here for the
# ACME issuance hot path.
boost-harness = { workspace = true }
# Cryptographic primitives used by the current X.509, CSR, TLS and HTTP code,
# plus the family DER writer that backs certificate and CSR encoding.
sha2 = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
rsa = { workspace = true }
signature = { workspace = true }
base64 = { workspace = true }
boost-random = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
aes-gcm = { workspace = true }
hmac = { workspace = true }
x25519-dalek = { workspace = true }
